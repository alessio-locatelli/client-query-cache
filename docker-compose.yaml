services:
  mongo1:
    hostname: mongo1
    image: mongo:7.0.5
    expose:
      - 27017
    ports:
      - 27017:27017
    restart: always
    command: mongod --replSet myReplicaSet --bind_ip localhost,mongo1
    networks:
      - mongoCluster

  mongo2:
    hostname: mongo2
    image: mongo:7.0.5
    expose:
      - 27017
    ports:
      - 30002:27017
    restart: always
    command: mongod --replSet myReplicaSet --bind_ip localhost,mongo2
    networks:
      - mongoCluster

  mongo3:
    hostname: mongo3
    image: mongo:7.0.5
    expose:
      - 27017
    ports:
      - 30003:27017
    restart: always
    command: mongod --replSet myReplicaSet --bind_ip localhost,mongo3
    networks:
      - mongoCluster

  mongoinit:
    image: mongo:7.0.5
    # this container will exit after executing the command
    restart: "no"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    command: >
      mongo --host mongo1:27017 --eval 
      '
      db = (new Mongo("localhost:27017")).getDB("test");
      config = {
      "_id" : "my-mongo-set",
      "members" : [
        {
          "_id" : 0,
          "host" : "mongo1:27017",
          "prioriry": 1"
        },
        {
          "_id" : 1,
          "host" : "mongo2:27017",
          "prioriry": 0.5"
        },
        {
          "_id" : 2,
          "host" : "mongo3:27017",
          "prioriry": 0.5
        }
      ]
      };
      rs.initiate(config);
      '
    networks:
      - mongoCluster

networks:
  mongoCluster:
    name: mongoCluster
    external: true
