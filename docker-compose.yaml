services:
  mongo:
    image: mongo:8.0.4
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    ports:
      - 27017:27017
    healthcheck:
      test: mongosh --eval 'db.runCommand("ping")'
      interval: 1s
      timeout: 5s
      retries: 5

  mongo_helper:
    image: mongo:8.0.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mongosh --host mongo --eval 'rs.initiate({_id:"rs0", members: [{_id:0,host:"localhost:27017"}]})'
    depends_on:
      mongo:
        condition: service_healthy
