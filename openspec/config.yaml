schema: spec-driven

rules:
  specs:
    - >-
      Keep each requirement's text within 500 characters. Split distinct obligations into focused requirements, preserving their meaning and assigning each scenario to the requirement it verifies.
  tasks:
    - >-
      Assume that tasks will be executed by a coding agent with no access to the current conversation. Write `tasks.md` to be concrete and mechanical. When relevant, include command examples. Avoid vague or abstract prose that may require additional planning or interpretation.
    - >-
      Common obvious development steps (e.g., "run tests", "close completed issue", "archive specs") are already covered by the project's documentation and are mandatory to follow; these must not be duplicated into the list of tasks, as that would be nothing more than extra noise.
    - >-
      Unless this is something like a meta spec that needs to track separate tickets, do not track unrelated or follow-up work as open checkboxes. Doing so leads to scope creep and prevents archiving the spec once its dedicated work is completed. Instead, track major dedicated work in their own specs or tickets.
    - >-
      Add a final `Code Quality` section containing two tasks:

      - Scan the entire file for edited or added tests (including pre-existing tests within the file) and ensure that the "Writing Tests" guidelines from `AGENTS.md` are applied, including test parametrization.
      - If you are Claude Code, confirm that you added no new prose to the code (all "why" explanations must go in the specs and commit bodies). OpenAI Codex is exempt from this rule because it understands the difference between garbage and valuable code comments.

      Inapplicable tasks are marked as completed with a short reason (e.g., "touches no code" or "specs applied by GPT").
