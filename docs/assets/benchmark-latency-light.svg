<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="Median read latency: direct MongoDB read 120 microseconds versus cached read hit 61 microseconds, about 2.0 times faster">
  <rect x="0" y="0" width="560" height="190" fill="#fcfcfb" rx="8"/>
  <text x="16" y="26" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b0b0b">Cached reads: ~2.0&#215; faster median latency</text>
  <line x1="190" y1="40" x2="190" y2="140" stroke="#d8d7d2" stroke-width="1"/>
  <text x="16" y="64" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b">Direct MongoDB read</text>
  <path d="M190,48 L469.8,48 Q473.8,48 473.8,52 L473.8,68 Q473.8,72 469.8,72 L190,72 Z" fill="#2a78d6"/>
  <text x="481.8" y="64" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">120 &#181;s</text>
  <text x="16" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b">Cached read (hit)</text>
  <path d="M190,104 L328.6,104 Q332.6,104 332.6,108 L332.6,124 Q332.6,128 328.6,128 L190,128 Z" fill="#eb6834"/>
  <text x="340.6" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b">61 &#181;s</text>
  <text x="16" y="164" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">read_heavy workload &#183; small documents &#183; local single-node benchmark, p50</text>
</svg>
