name: Set up the locked uv and just toolchain
description: Installs shared uv and just versions and optionally provisions Rust for native consumers.

inputs:
  python-version:
    description: Optional compatibility lane; otherwise use .python-version.
  rust:
    description: Install the selected Rust toolchain for jobs that build or check native code.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.rust == 'true'
      shell: bash
      run:
        | # zizmor: ignore[github-env] This adds only the trusted runner HOME path; no PR input is used.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        test -x "$HOME/.cargo/bin/rustup"
        test "$(readlink -f "$HOME/.cargo/bin/cargo")" = "$(readlink -f "$HOME/.cargo/bin/rustup")"
        "$HOME/.cargo/bin/rustup" install
        "$HOME/.cargo/bin/rustup" show active-toolchain
        "$HOME/.cargo/bin/rustc" --version
        "$HOME/.cargo/bin/cargo" --version

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.13.4"
        python-version: ${{ inputs.python-version }}
        # https://github.com/astral-sh/setup-uv/blob/20cfd1bf945f4377ade1205e4dbc17946fc9a30d/action.yml
        # The default is auto (disabled for tag pushes and workflow_run/release events). We override it because locked download caches should also be reused by release/documentation jobs.
        enable-cache: true
        # The default is no cache suffix. We override it because jobs synchronize
        # different dependency groups and must not race to reserve one cache key.
        cache-suffix: ${{ github.workflow }}-${{ github.job }}
        # The default is the action's recursive requirements/constraints/pyproject/lock globs. We override it because this shared project environment uses root uv.lock and Python selection, independently of example script environments.
        cache-dependency-glob: |
          uv.lock
          .python-version

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: "1.57.0"
