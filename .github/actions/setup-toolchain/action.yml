name: Set up the locked uv and just toolchain
description: Installs shared uv and just versions; uv uses the project Python selection. Optionally installs the selected Rust toolchain.

inputs:
  python-version:
    description: Optional compatibility lane; otherwise use .python-version.
  rust:
    description: Set to true in jobs that compile native code to install the rust-toolchain.toml selection.
  rust-components:
    description: Space-separated Rust components to add to the selected toolchain, for example llvm-tools in jobs that build a release wheel.

runs:
  using: composite
  steps:
    # rustup 1.29 toolchain install --no-self-update: The default may also update rustup. We override it because CI provisions only the selected toolchain.
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup toolchain install --no-self-update

    # rustup 1.29 component add: https://rust-lang.github.io/rustup/concepts/components.html
    # The default is the components of the toolchain's minimal profile. We override it because
    # the profile-guided release build merges its profile with llvm-profdata from llvm-tools.
    - if: inputs.rust-components != ''
      shell: bash
      run: |
        read -ra components <<< "${INPUTS_RUST_COMPONENTS}"
        rustup component add "${components[@]}"
      env:
        INPUTS_RUST_COMPONENTS: ${{ inputs.rust-components }}

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.13.6"
        python-version: ${{ inputs.python-version }}
        # https://github.com/astral-sh/setup-uv/blob/20cfd1bf945f4377ade1205e4dbc17946fc9a30d/action.yml
        # The default is auto (disabled for tag pushes and workflow_run/release events). We override it because locked download caches should also be reused by release/documentation jobs.
        enable-cache: true
        # The default is no cache suffix. We override it because jobs synchronize
        # different dependency groups and must not race to reserve one cache key.
        cache-suffix: ${{ github.workflow }}-${{ github.job }}
        # The default is the action's recursive requirements/constraints/pyproject/lock globs. We override it because this shared project environment uses root uv.lock and Python selection, independently of example script environments.
        cache-dependency-glob: |
          uv.lock
          .python-version

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: "1.59.0"
