name: Set up the locked uv, Python, and just toolchain
description: Installs the pinned uv, Python, and just versions shared by every CI job.

inputs:
  uv-version:
    description: uv version to install
    required: true
  python-version:
    description: CPython version to install
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: "1.57.0"
