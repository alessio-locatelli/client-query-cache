name: Set up the locked uv and just toolchain
description: Installs shared uv and just versions; uv uses the project Python selection.

inputs:
  python-version:
    description: Optional compatibility lane; otherwise use .python-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.19"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          .python-version

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: "1.57.0"
