version: 2
# Hosted Dependabot, reviewed 2026-10-06:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# For pip, github-actions, npm, pre-commit, uv, and docker open-pull-requests-limit:
# The default is 5 per ecosystem. We override it because two version-update PRs per ecosystem bound review and CI load.
# For each ecosystem's cooldown.default-days:
# The default is no cooldown. We override it because new releases need seven days of aging before ordinary proposals.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
