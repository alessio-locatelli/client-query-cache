name: Accept dependency updates

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Trusted main code and live API metadata only; no checkout, run artifacts, or caches.
    workflows: ["Pull request validation"]
    types: [completed]

# GitHub workflow syntax (2026-10-06):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The default is inherited repository/organization token policy. We override it because
# workflow tokens need only read access until a job explicitly elevates its grants;
# unspecified grants are none.
permissions:
  contents: read
  pull-requests: read # Verify live PR metadata before issuing an App token.

defaults:
  run:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsshell
    # The default is bash -e on these Linux runners. We override it because API/JSON pipelines must also fail when an earlier command fails (bash adds -o pipefail).
    shell: bash

env:
  GH_REPO: ${{ github.repository }}
  PR_POLICY: >-
    .state == "open" and .draft == false and
    .user.type == "Bot" and
    (.user.login == "dependabot[bot]" or .user.login == "renovate[bot]") and
    .head.repo.full_name == $repo and .base.repo.full_name == $repo and
    .base.ref == "main" and .head.sha == $head

jobs:
  select:
    name: Verify dependency update
    # The default is implicit success() without these eligibility restrictions. We
    # override it because only successful, bot-initiated validation of a
    # same-repository pull request may lead to privileged acceptance.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/test.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.type == 'Bot' &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
       github.event.workflow_run.actor.login == 'renovate[bot]')
    runs-on: ubuntu-24.04
    # timeout-minutes for select (5m), accept (5m): The default is 360. We override it
    # because stalled jobs must stop within their assigned validation/publication
    # budgets.
    timeout-minutes: 5
    concurrency:
      group: dependency-selection-${{ github.event.workflow_run.head_sha }}
      # cancel-in-progress: The default is false. We override it because newer
      # validation or selection supersedes an unfinished older run.
      cancel-in-progress: true
    outputs:
      eligible: ${{ steps.metadata.outputs.eligible }}
      pr_number: ${{ steps.metadata.outputs.pr_number }}
      pr_id: ${{ steps.metadata.outputs.pr_id }}
      head_sha: ${{ steps.metadata.outputs.head_sha }}
    steps:
      - id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          matches="$(gh api --paginate --slurp "repos/$GH_REPO/commits/$RUN_HEAD/pulls" \
            | jq --arg repo "$GH_REPO" --arg head "$RUN_HEAD" "add | map(select($PR_POLICY))")"
          case "$(jq length <<< "$matches")" in
            0)
              echo "::notice::No open eligible PR has the validated head; no acceptance requested."
              ;;
            1)
              {
                echo "eligible=true"
                jq -r '.[0] | "pr_number=\(.number)\npr_id=\(.node_id)\nhead_sha=\(.head.sha)"' <<< "$matches"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Several eligible PRs have the validated head; acceptance refused."
              exit 1
              ;;
          esac

  accept:
    name: Enable native auto-merge and approve
    needs: select
    # The default is implicit success() without this restriction. We override it because
    # acceptance must use the verified selection.
    if: needs.select.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dependency-automerge-${{ needs.select.outputs.pr_number }}
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
      # The default is false. We keep it explicit because acceptance must finish its verified auto-merge/approval transition; interruption can leave a live PR with auto-merge requested but without its approval. Disposable jobs without the live App installation/PR cannot cover that privileged transition, so this safety pin stays explicit.
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ needs.select.outputs.pr_number }}
      PR_ID: ${{ needs.select.outputs.pr_id }}
      HEAD_SHA: ${{ needs.select.outputs.head_sha }}
    steps:
      - id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # jq -e here and in verify_pr: https://jqlang.org/manual/#invoking-jq
          # The default is zero after successful evaluation, including false/null. We
          # override it because rejected metadata must stop acceptance before credential
          # issuance and before each privileged request.
          pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          if jq -e --arg repo "$GH_REPO" --arg head "$HEAD_SHA" "$PR_POLICY" <<< "$pr" > /dev/null; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR metadata changed; no acceptance requested."
          fi

      # if for the configuration, app-token and auto-merge/approval steps: The default is
      # implicit success() without the eligibility check. We override it because
      # credentials are issued and acceptance is requested only while the live PR still
      # matches the validated selection; a failed configuration check skips later steps.
      - if: steps.metadata.outputs.eligible == 'true'
        env:
          CONFIGURED: ${{ vars.DEPENDENCY_AUTOMERGE_APP_ID != '' && secrets.DEPENDENCY_AUTOMERGE_APP_PRIVATE_KEY != '' }} # zizmor: ignore[secrets-outside-env] -- Repository App configuration; only test presence after metadata verification.
        run: |
          if [[ "$CONFIGURED" != "true" ]]; then
            echo "::error::Dependency acceptance is not configured: set the DEPENDENCY_AUTOMERGE_APP_ID variable and the DEPENDENCY_AUTOMERGE_APP_PRIVATE_KEY secret (docs/development/executable-version-updates.md)."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.metadata.outputs.eligible == 'true'
        with:
          app-id: ${{ vars.DEPENDENCY_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_AUTOMERGE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] -- Repository App credential goes only to this pinned action after metadata verification.
          # https://github.com/actions/create-github-app-token/blob/bcd2ba49218906704ab6c1aa796996da409d3eb1/lib/main.js
          # Pinned v3.2.0: owner omission with repositories supplied uses GITHUB_REPOSITORY_OWNER.
          # The default is the current repository owner. We keep it explicit because privileged token creation must remain visibly bound to that owner; a changed resolution could issue credentials for an unintended installation, which safe tests without the live App cannot cover.
          owner: ${{ github.repository_owner }}
          # The default is all repositories owned by the supplied owner. We override it because acceptance credentials must be limited to this repository.
          repositories: ${{ github.event.repository.name }}
          # Pinned v3.2.0 lib/main.js/get-permissions-from-inputs.js: omitted permissions inherit installation grants.
          # For permission-contents and permission-pull-requests: The default is the installation's grants when no permission inputs are supplied, or no requested grant for a permission omitted from an explicit list. We override it because approval/rebase auto-merge needs exactly these write grants, without expanding to the App's other installation permissions.
          permission-contents: write
          permission-pull-requests: write

      - if: steps.metadata.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTO_MERGE_MUTATION: >-
            mutation($id: ID!, $head: GitObjectID!) {
            enablePullRequestAutoMerge(input: {pullRequestId: $id, expectedHeadOid: $head, mergeMethod: REBASE})
            { clientMutationId } }
        run: |
          verify_pr() {
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
              | jq -e --arg repo "$GH_REPO" --arg head "$HEAD_SHA" "$PR_POLICY" > /dev/null
          }
          verify_pr
          # GitHub GraphQL: https://docs.github.com/en/graphql/reference/mutations#enablepullrequestautomerge
          # mergeMethod: The default is MERGE. We override it because the main ruleset
          # permits only rebase merging.
          # expectedHeadOid: The default is no head constraint. We override it because
          # acceptance must not merge a newer unvalidated head.
          # gh 2.97.0 api --silent here and for the approval: https://cli.github.com/manual/gh_api
          # The default is printing the response. We override it because successful
          # request metadata should not obscure diagnostics.
          if ! gh api graphql --silent -f query="$AUTO_MERGE_MUTATION" -f id="$PR_ID" -f head="$HEAD_SHA"; then
            echo "::error::GitHub rejected the auto-merge request, for example because repository auto-merge is disabled or the PR is already mergeable; no approval was submitted."
            exit 1
          fi
          verify_pr
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$HEAD_SHA" --silent
