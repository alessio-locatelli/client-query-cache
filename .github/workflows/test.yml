name: Pull request validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=prek versioning=pep440
  PREK_VERSION: "0.5.2"

jobs:
  scope:
    name: Select validation tiers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      container: ${{ steps.paths.outputs.container }}
      benchmark: ${{ steps.paths.outputs.benchmark }}
      python: ${{ steps.paths.outputs.python }}
      format: ${{ steps.paths.outputs.format }}
      documentation: ${{ steps.paths.outputs.documentation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          git diff --name-only -z "${BASE_REVISION}" "${HEAD_REVISION}" \
            | python3 -m scripts.ci_scope >> "${GITHUB_OUTPUT}"

  prek:
    name: Prek
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-py${{ hashFiles('.python-version') }}-v${{ env.PREK_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lycheecache
            .ruff_cache
          key: prek-results-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'lychee.toml', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            prek-results-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'lychee.toml', 'pyproject.toml') }}-

      - run: uv sync --locked --all-groups

      - run: |
          uv tool install "prek==${PREK_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - run: SKIP=slotscheck,prettier,lychee prek run --all-files

      - run: prek run lychee --all-files
        env:
          GH_TOKEN: ${{ github.token }}

      - run: just --fmt --check

  prettier:
    name: Prettier, Markdownlint, and OpenSpec
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.scope.outputs.format == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.scope.outputs.format == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - if: needs.scope.outputs.format == 'true'
        run: npm ci --silent

      - if: needs.scope.outputs.format == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', '.prettierrc*', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', '.prettierrc*', '.prettierignore') }}-

      - if: needs.scope.outputs.format == 'true'
        run: npm run format:check

      - if: needs.scope.outputs.format == 'true'
        run: npm exec -- openspec validate --all --strict

  documentation:
    name: Documentation build
    needs: [scope, prek, prettier]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.scope.outputs.documentation == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: needs.scope.outputs.documentation == 'true'
        uses: $/.github/actions/setup-toolchain

      - if: needs.scope.outputs.documentation == 'true'
        run: |
          stable_tag="$(python3 -c 'import tomllib; print(tomllib.load(open("stable-docs.toml", "rb"))["validation_tag"])')"
          git fetch --no-tags origin "refs/tags/${stable_tag}:refs/tags/${stable_tag}"
          backport="$(STABLE_TAG="${stable_tag}" python3 -c 'import os, tomllib; records = tomllib.load(open("stable-docs.toml", "rb"))["backports"]; tag = os.environ["STABLE_TAG"]; print(records[tag]["fetch_ref"] if tag in records else "")')"
          if [[ -n "${backport}" ]]; then
            git fetch --no-tags origin "${backport}:${backport}"
          fi
          just docs-build-editions "${stable_tag}"

  package:
    name: Static checks, packaging, and isolated install
    needs: [scope, prek, prettier]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - run: uv sync --locked --all-groups

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - run: uv run -- mypy --install-types

      - run: just typecheck-examples

      - run: uv run -- python -m slotscheck src tests

      - run: just verify-release

  integration-e2e:
    name: Docker-backed integration, end-to-end, and coverage
    needs: [scope, prek, prettier]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - run: uv sync --locked --all-groups

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: pytest-hypothesis-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'pytest.ini') }}-${{ github.sha }}
          restore-keys: |
            pytest-hypothesis-${{ runner.os }}-py${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'pytest.ini') }}-

      - run: just tests_and_coverage

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log
          path: |
            pytest.log
            pytest-gw*.log
          if-no-files-found: ignore
          retention-days: 7

  memory:
    name: Cache memory regression guard
    needs: [scope, prek, prettier]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - run: uv sync --locked --group memory

      - run: just test-memory

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-reports
          path: memory-reports/
          if-no-files-found: ignore
          retention-days: 7

  guard:
    name: Cache hot-path performance guard
    needs: [prek, prettier]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_REVISION: ${{ github.event.pull_request.base.sha }}
      HEAD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: scope
        run: |
          requires_guard="$(
            git diff --name-only "${BASE_REVISION}" "${HEAD_REVISION}" \
              | python3 -m benchmarks.stream_cost.guard_scope
          )"
          echo "requires_guard=${requires_guard}" >> "${GITHUB_OUTPUT}"

      - if: steps.scope.outputs.requires_guard != 'true'
        run: |
          echo "No Python, dependency, or guard input changed; skipping the timed comparison." \
            >> "${GITHUB_STEP_SUMMARY}"

      - if: steps.scope.outputs.requires_guard == 'true'
        uses: $/.github/actions/setup-toolchain

      - if: steps.scope.outputs.requires_guard == 'true'
        run: uv sync --locked --all-groups

      - if: steps.scope.outputs.requires_guard == 'true'
        run: |
          set -o pipefail
          uv run -- python -m benchmarks.stream_cost.guard_check \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-revision "${BASE_REVISION}" \
            --head-revision "${HEAD_REVISION}" \
            --work-dir "${RUNNER_TEMP}/pr-performance-guard" \
            --output guard-reports/guard.report.json \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - if: always() && steps.scope.outputs.requires_guard == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-performance-guard-report
          path: guard-reports/guard.report.json
          if-no-files-found: warn
          retention-days: 30

  container:
    name: Development container build and tools
    needs: [scope, prek, prettier]
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: bash scripts/check_dev_container.sh docker

  benchmark-startup:
    name: Isolated benchmark replica-set startup
    needs: [scope, prek, prettier]
    if: needs.scope.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - run: uv sync --locked --all-groups

      - run: uv run -- pytest -q tests/benchmark/stream_cost/test_topology_integration.py --timeout=120
