name: Pull request validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress: The default is false. We override it because newer PR
  # validation supersedes an unfinished older run.
  cancel-in-progress: true

on:
  pull_request:

# GitHub workflow syntax (2026-10-06):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The default is inherited repository/organization token policy. We override it because
# workflow tokens need only read access until a job explicitly elevates its grants;
# unspecified grants are none.
permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=prek versioning=pep440
  PREK_VERSION: "0.5.4"

# Shared rationales for the occurrences listed below.
# checkout v7.0.1:
# https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/action.yml
# persist-credentials in scope, prek, prettier, documentation, arm64, package, integration-e2e, pymongo-min,
# mongodb-min, memory, guard, container and benchmark-startup: The default is true. We override it
# because later repository commands must not inherit checkout credentials.
# fetch-depth in scope and guard: The default is 1. We override it because revision
# comparisons need earlier history.
# uv 0.12.20: https://docs.astral.sh/uv/reference/cli/
# uv sync --locked in arm64, package, integration-e2e, pymongo-min, mongodb-min, memory, guard
# and benchmark-startup: The default is inherited UV_LOCKED, otherwise unlocked resolution.
# We override it because these standalone commands must validate the committed lockfile.
# uv sync --no-default-groups --group: The default includes dev. We override it
# because each job selects only its build, typing, test, compatibility, or benchmark
# tools; full coverage also exercises the real documentation tools.
# UV_NO_SYNC in arm64, package, integration-e2e, pymongo-min, mongodb-min, memory, guard,
# and benchmark-startup: The default is false. We override it because uv run must
# reuse each job's explicitly synchronized environment without adding dev.
# cache v6.1.0:
# https://github.com/actions/cache/blob/55cc8345863c7cc4c66a329aec7e433d2d1c52a9/action.yml
# restore-keys for prek-results (prek), prettier (prettier), rust-tools (rust-static),
# mypy (package) and pytest-hypothesis (integration-e2e): The default is no prefix
# fallback. We override it because compatible environment/dependency keys allow
# reuse across commits.
# strategy.fail-fast in package and integration-e2e: The default is true. We override
# it because every supported Python lane must report even when another lane fails.
# upload-artifact v7.0.1:
# https://github.com/actions/upload-artifact/blob/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a/action.yml
# if: failure() for pytest-log (integration-e2e), pytest-log-pymongo-min (pymongo-min),
# pytest-log-mongodb-min (mongodb-min) and memory-reports (memory): The default
# is implicit success(). We override it because diagnostics are needed on failed runs.
# if-no-files-found for those uploads: The default is warn. We override it because
# failures before test execution can legitimately produce no diagnostics.
# retention-days for pytest-log, pytest-log-pymongo-min, pytest-log-mongodb-min, memory-reports and
# pr-performance-guard-report (guard):
# The default is inherited repository/organization retention. We override it because
# diagnostics need bounded storage lifetimes.

jobs:
  scope:
    name: Select validation tiers
    runs-on: ubuntu-24.04
    # timeout-minutes for scope (5m), prek (15m), prettier (10m), documentation (10m),
    # package (15m), integration-e2e (20m), pymongo-min (20m), mongodb-min (20m),
    # python-compatibility (5m), memory (10m), guard (20m), container (20m),
    # benchmark-startup (10m): The default is 360. We override it because stalled jobs
    # must stop within their assigned validation/publication budgets.
    timeout-minutes: 5
    outputs:
      container: ${{ steps.paths.outputs.container }}
      benchmark: ${{ steps.paths.outputs.benchmark }}
      python: ${{ steps.paths.outputs.python }}
      arm64: ${{ steps.paths.outputs.arm64 }}
      rust: ${{ steps.paths.outputs.rust }}
      format: ${{ steps.paths.outputs.format }}
      documentation: ${{ steps.paths.outputs.documentation }}
      python-versions: ${{ steps.python.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          git diff --name-only -z "${BASE_REVISION}" "${HEAD_REVISION}" \
            | python3 -m scripts.ci_scope >> "${GITHUB_OUTPUT}"

      - id: python
        run: python3 -m scripts.ci_python_matrix >> "${GITHUB_OUTPUT}"

  prek:
    name: Prek
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # https://github.com/actions/setup-node/blob/820762786026740c76f36085b0efc47a31fe5020/action.yml
          # node-version-file: The default is unset. We override it because the
          # Renovate hook needs the repository-selected Node.js version.
          node-version-file: .node-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-py${{ hashFiles('.python-version') }}-node${{ hashFiles('.node-version') }}-v${{ env.PREK_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lycheecache
            .ruff_cache
          key: prek-results-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'lychee.toml', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            prek-results-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'lychee.toml', 'pyproject.toml') }}-

      - run: uv tool install "prek==${PREK_VERSION}"

      # Prek hook skipping:
      # https://prek.j178.dev/quickstart/#temporarily-disabling-hooks
      # SKIP: The default is no skipped hooks. We override it because slotscheck and
      # formatting and Rust have dedicated lanes, while Lychee runs separately with its
      # step-scoped GitHub token.
      - run: SKIP=slotscheck,prettier,lychee,rust-lint prek run --all-files

      - run: prek run lychee --all-files
        env:
          GH_TOKEN: ${{ github.token }}

      - run: just --fmt --check

  prettier:
    name: Prettier, Markdownlint, and OpenSpec
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.scope.outputs.format == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.scope.outputs.format == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # setup-node v7.0.0:
          # https://github.com/actions/setup-node/blob/820762786026740c76f36085b0efc47a31fe5020/action.yml
          # The default is automatic npm caching only when supported package-manager
          # metadata selects npm; package.json has none. We override it because CI
          # should reuse locked npm downloads.
          cache: npm

      - if: needs.scope.outputs.format == 'true'
        # npm 11: https://docs.npmjs.com/cli/v11/using-npm/config#loglevel
        # --silent: The default is normal progress output. We override it because CI
        # should emphasize diagnostics.
        run: npm ci --silent

      - if: needs.scope.outputs.format == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json', '.prettierrc*', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json', '.prettierrc*', '.prettierignore') }}-

      - if: needs.scope.outputs.format == 'true'
        run: npm run format:check

      - if: needs.scope.outputs.format == 'true'
        # OpenSpec 1.14.0 validate --help: The default is strict=false. We override it
        # because specification warnings must fail the quality gate.
        run: npm exec -- openspec validate --all --strict

  documentation:
    name: Documentation build
    needs: [scope, prek, prettier]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.scope.outputs.documentation == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.scope.outputs.documentation == 'true'
        uses: $/.github/actions/setup-toolchain

      - if: needs.scope.outputs.documentation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: just docs-build-editions

  rust-static:
    name: Rust static checks
    needs: [scope, prek, prettier]
    runs-on: ubuntu-24.04
    # The default is 360 minutes. We override it because tool builds and static
    # checks must stop within a bounded validation budget.
    timeout-minutes: 15
    steps:
      - if: needs.scope.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default is true. We override it because native tooling needs no credentials.
          persist-credentials: false

      - if: needs.scope.outputs.rust == 'true'
        uses: $/.github/actions/setup-toolchain

      - if: needs.scope.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rust-tools
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('justfile') }}
          restore-keys: |
            rust-tools-${{ runner.os }}-${{ runner.arch }}-

      - if: needs.scope.outputs.rust == 'true'
        run: just setup-rust

      - if: needs.scope.outputs.rust == 'true'
        run: just rust-lint

  rust-tests:
    name: Rust tests and concurrency models
    needs: [scope, rust-static]
    runs-on: ubuntu-24.04
    # The default is 360 minutes. We override it because a stalled native test
    # or model must stop within the test budget.
    timeout-minutes: 15
    steps:
      - if: needs.scope.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default is true. We override it because tests need no credentials.
          persist-credentials: false

      - if: needs.scope.outputs.rust == 'true'
        uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - if: needs.scope.outputs.rust == 'true'
        run: just rust-tests

  arm64:
    name: Linux ARM64 runtime and distribution
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    # The default is 360 minutes. Bound native builds, isolated installs and
    # disposable MongoDB tests to the same budget as other runtime lanes.
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - run: uv sync --locked --no-default-groups --group test --group build

      - run: |
          uname -m
          git rev-parse HEAD
          uv run -- python -c 'import sys; print(sys.version)'

      - run: cargo test --locked --manifest-path native/shared-index/Cargo.toml --quiet

      - run: just verify-release

      # pytest -q: The default is verbosity zero. Keep successful output concise.
      - run: uv run -- pytest -q tests/core tests/synchronous tests/asynchronous tests/shared_cache tests/e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log-arm64
          path: |
            pytest.log
            pytest-gw*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Static checks, packaging, and isolated install (${{ matrix.python }})
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.scope.outputs.python-versions) }}
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          python-version: ${{ matrix.python }}
          rust: "true"

      - run: uv sync --locked --no-default-groups --group typing --group build

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      # mypy 2.3.1: https://mypy.readthedocs.io/en/stable/command_line.html
      # --install-types: The default is false. We override it because validation also
      # installs available missing stubs.
      - run: uv run -- mypy --install-types

      - run: just typecheck-examples

      # The local slotscheck Prek hook checks every tracked Python file. Listing the
      # directories avoids installing Prek in each lane; we accept that a new top-level
      # Python directory must be added here manually.
      - run: uv run -- python -m slotscheck src tests benchmarks scripts research

      - run: just verify-release

  integration-e2e:
    name: Docker-backed integration, end-to-end, and coverage (${{ matrix.python }})
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.scope.outputs.python-versions) }}
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          python-version: ${{ matrix.python }}
          rust: "true"

      - run: uv sync --locked --no-default-groups --group test --group test-tools --group docs

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: pytest-hypothesis-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'pytest.ini') }}-${{ github.sha }}
          restore-keys: |
            pytest-hypothesis-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'pytest.ini') }}-

      - run: just tests_and_coverage

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log-${{ matrix.python }}
          path: |
            pytest.log
            pytest-gw*.log
          if-no-files-found: ignore
          retention-days: 7

  pymongo-min:
    name: Minimum PyMongo behavioral compatibility
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - run: uv sync --locked --no-default-groups --group compatibility

      - run: just test-pymongo-min

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log-pymongo-min
          path: |
            pytest-pymongo-min.log
            pytest-pymongo-min-gw*.log
          if-no-files-found: ignore
          retention-days: 7

  mongodb-min:
    name: Minimum MongoDB server compatibility
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.python == 'true'
    # MongoDB kernel compatibility: docs/development/parallel-test-execution.md#ci-host-compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - run: uv sync --locked --no-default-groups --group test

      - run: just test-mongodb-min

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log-mongodb-min
          path: |
            pytest-mongodb-min.log
            pytest-mongodb-min-gw*.log
          if-no-files-found: ignore
          retention-days: 7

  python-compatibility:
    name: Python compatibility
    needs: [scope, package, integration-e2e, pymongo-min, mongodb-min, arm64]
    # The default is implicit success(). We override it because failed matrix
    # prerequisites must fail the aggregate gate visibly instead of skipping it.
    if: always() && needs.scope.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PYTHON_SELECTED: ${{ needs.scope.outputs.python }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          TEST_RESULT: ${{ needs.integration-e2e.result }}
          PYMONGO_MIN_RESULT: ${{ needs.pymongo-min.result }}
          MONGODB_MIN_RESULT: ${{ needs.mongodb-min.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
        run: |
          status=0
          if [[ "${PYTHON_SELECTED}" == true && "${PACKAGE_RESULT}" != success ]]; then
            echo "::error title=Python compatibility::The static checks, packaging, and isolated install matrix finished with '${PACKAGE_RESULT}'; open its failed lane for the cause."
            status=1
          fi
          if [[ "${PYTHON_SELECTED}" == true && "${TEST_RESULT}" != success ]]; then
            echo "::error title=Python compatibility::The Docker-backed integration, end-to-end, and coverage matrix finished with '${TEST_RESULT}'; open its failed lane for the cause."
            status=1
          fi
          if [[ "${PYTHON_SELECTED}" == true && "${PYMONGO_MIN_RESULT}" != success ]]; then
            echo "::error title=Python compatibility::Minimum PyMongo behavioral compatibility finished with '${PYMONGO_MIN_RESULT}'; open that job for the cause."
            status=1
          fi
          if [[ "${PYTHON_SELECTED}" == true && "${MONGODB_MIN_RESULT}" != success ]]; then
            echo "::error title=Python compatibility::Minimum MongoDB server compatibility finished with '${MONGODB_MIN_RESULT}'; open that job for the cause."
            status=1
          fi
          if [[ "${ARM64_RESULT}" != success ]]; then
            echo "::error title=Python compatibility::Linux ARM64 runtime and distribution finished with '${ARM64_RESULT}'; open that job for the cause."
            status=1
          fi
          exit "${status}"

  memory:
    name: Cache memory regression guard
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "true"
      # uv 0.13.4: https://docs.astral.sh/uv/reference/cli/#uv-sync--no-managed-python
      # The default allows uv-managed Python. We override it because this profiler
      # lane uses the shared Python build explained in the memory test guide.
      UV_NO_MANAGED_PYTHON: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # setup-python v7: https://github.com/actions/setup-python/tree/5fda3b95a4ea91299a34e894583c3862153e4b97
          # The default discovers .python-version with a warning. We override it
          # because the interpreter selection must be explicit and warning-free.
          python-version-file: .python-version

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - run: uv sync --locked --no-default-groups --group test --group memory

      - run: just test-memory

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-reports
          path: memory-reports/
          if-no-files-found: ignore
          retention-days: 7

  guard:
    name: Cache hot-path performance guard
    needs: [prek, prettier]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "true"
      BASE_REVISION: ${{ github.event.pull_request.base.sha }}
      HEAD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: scope
        run: |
          requires_guard="$(
            git diff --name-only "${BASE_REVISION}" "${HEAD_REVISION}" \
              | python3 -m benchmarks.stream_cost.guard_scope
          )"
          echo "requires_guard=${requires_guard}" >> "${GITHUB_OUTPUT}"

      - if: steps.scope.outputs.requires_guard != 'true'
        run: |
          echo "No Python, dependency, Rust toolchain, or guard input changed; skipping the timed comparison." \
            >> "${GITHUB_STEP_SUMMARY}"

      - if: steps.scope.outputs.requires_guard == 'true'
        uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - if: steps.scope.outputs.requires_guard == 'true'
        run: uv sync --locked --no-default-groups --group benchmark

      - if: steps.scope.outputs.requires_guard == 'true'
        run: |
          # The default is off in the unspecified Linux shell (bash -e). We override it
          # because benchmark failure must fail the step even when tee writes
          # successfully.
          set -o pipefail
          uv run -- python -m benchmarks.stream_cost.guard_check \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-revision "${BASE_REVISION}" \
            --head-revision "${HEAD_REVISION}" \
            --work-dir "${RUNNER_TEMP}/pr-performance-guard" \
            --output guard-reports/guard.report.json \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      # The default is implicit success(). We override it because partial reports must
      # remain available after failed measurements.
      - if: always() && steps.scope.outputs.requires_guard == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-performance-guard-report
          path: guard-reports/guard.report.json
          retention-days: 30

  container:
    name: Development container build and tools
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: bash scripts/check_dev_container.sh docker

  benchmark-startup:
    name: Isolated benchmark replica-set startup
    needs: [scope, prek, prettier, rust-static]
    if: needs.scope.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      - run: uv sync --locked --no-default-groups --group test

      # pytest 9.1.1 / pytest-timeout 2.4.0:
      # https://docs.pytest.org/en/stable/reference/reference.html
      # -q: The default is verbosity zero. We override it because CI output should
      # emphasize failures.
      # --timeout: The default is pytest.ini 30s. We override it because disposable
      # image startup can exceed the normal budget.
      - run: uv run -- pytest -q tests/benchmark/stream_cost/test_topology_integration.py --timeout=120
