name: Python validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**.py"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.14"

jobs:
  package:
    name: Static checks, packaging, and isolated install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --locked --all-groups

      - run: uv run -- mypy --install-types

      - run: uv run -- python -m slotscheck src tests

      - run: uv build

      - run: |
          for artifact in dist/*.tar.gz dist/*.whl; do
            uv run --isolated --no-project --python "${PYTHON_VERSION}" --with "${artifact}" -- \
              python -I -c "from mongo_client_cache import CacheManager, CachedCollection, CachedDatabase"
          done

  integration-e2e:
    name: Docker-backed integration, end-to-end, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --locked --all-groups

      - run: just tests_and_coverage

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore
          retention-days: 7
