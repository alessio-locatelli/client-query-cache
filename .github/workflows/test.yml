name: Python validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**.py"
      - "pytest.ini"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.19"
  PYTHON_VERSION: "3.14"

jobs:
  package:
    name: Static checks, packaging, and isolated install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --locked --all-groups

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - run: uv run -- mypy --install-types

      - run: just typecheck-examples

      - run: uv run -- python -m slotscheck src tests

      - run: just verify-release

  integration-e2e:
    name: Docker-backed integration, end-to-end, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --locked --all-groups

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: pytest-hypothesis-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'pytest.ini') }}-${{ github.sha }}
          restore-keys: |
            pytest-hypothesis-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'pytest.ini') }}-

      - run: just tests_and_coverage

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore
          retention-days: 7
