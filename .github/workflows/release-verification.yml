name: Release verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress: The default is false. We override it because newer validation or
  # selection supersedes an unfinished older run.
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate release tag (e.g. v1.2.3) to check against the declared package version. Leave empty to verify build and import only.
        type: string

# GitHub workflow syntax (2026-10-06):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The default is inherited repository/organization token policy. We override it because
# workflow tokens need only read access until a job explicitly elevates its grants;
# unspecified grants are none.
permissions:
  contents: read

jobs:
  release-verification:
    name: Non-publishing release verification (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Keep both architecture outcomes when one fails.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstrategyfail-fast
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # timeout-minutes for release-verification (15m): The default is 360. We override it
    # because stalled jobs must stop within their assigned validation/publication
    # budgets.
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout v7.0.1:
          # https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/action.yml
          # persist-credentials: The default is true. We override it because later
          # repository commands must not inherit checkout credentials.
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      # uv 0.12.19: https://docs.astral.sh/uv/reference/cli/
      # --locked: The default is inherited UV_LOCKED, otherwise unlocked resolution. We
      # override it because this standalone CI command must validate the committed
      # lockfile.
      # --no-default-groups --group: The default includes dev. We override it
      # because this job needs only the build tools.
      # UV_NO_SYNC: The default is false. We override it because uv run must
      # reuse the explicitly synchronized environment without adding dev.
      - run: uv sync --locked --no-default-groups --group build

      - run: just verify-release "${INPUTS_TAG}"
        env:
          INPUTS_TAG: ${{ inputs.tag }}

      # upload-artifact: https://github.com/actions/upload-artifact
      # The default name is artifact. Separate native builds, keeping a single sdist
      # from x86-64 so the merged release set has no duplicate source archive.
      # retention-days defaults to repository policy; bound inspection artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.runner }}
          path: ${{ matrix.runner == 'ubuntu-24.04' && 'dist/' || 'dist/*.whl' }}
          retention-days: 7
