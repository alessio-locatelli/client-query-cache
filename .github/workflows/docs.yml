name: Publish documentation

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'documentation-publication' || format('documentation-skipped-{0}', github.run_id) }}
  # cancel-in-progress: The default is false. We override it because the latest eligible
  # controller must replace stale publication work; this concurrency group excludes
  # ineligible runs.
  cancel-in-progress: true

on: # zizmor: ignore[dangerous-triggers] Trusted main only; no triggering-run code or artifacts.
  push:
    branches: [main]
    paths:
      - "docs/user/**"
      - "examples/README.md"
      - "examples/*.py"
      - "zensical.toml"
      - "scripts/build_versioned_docs.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "justfile"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-toolchain/**"
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:

# GitHub workflow syntax (2026-10-06):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The default is inherited repository/organization token policy. We override it because
# workflow tokens need only read access until a job explicitly elevates its grants;
# unspecified grants are none.
permissions:
  contents: read

jobs:
  build:
    name: Build documentation artifact
    # The default is implicit success() without these eligibility restrictions. We
    # override it because publication must use trusted main and successful release
    # events.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    # timeout-minutes for build (10m), deploy (10m): The default is 360. We override it
    # because stalled jobs must stop within their assigned validation/publication
    # budgets.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout v7.0.1:
          # https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/action.yml
          # persist-credentials: The default is true. We override it because later
          # repository commands must not inherit checkout credentials.
          persist-credentials: false
          # ref: The default is the event reference/SHA. We override it because
          # publication must use current trusted main rather than an earlier snapshot.
          ref: main

      - uses: $/.github/actions/setup-toolchain

      - name: Assemble current published release and development
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: just docs-build-editions

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # pages: The default is none under workflow permissions. We override it because
      # Pages deployment requires publication access.
      pages: write # Publish the Pages artifact.
      # id-token: The default is none under workflow permissions. We override it because
      # Pages deployment requires OIDC authentication.
      id-token: write # Authenticate this deployment to Pages with OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
