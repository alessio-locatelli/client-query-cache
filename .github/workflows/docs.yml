name: Publish documentation

concurrency:
  group: documentation-publication
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/pypi-publishing-setup.md"
      - "!docs/ci-validation-caches.md"
      - "!docs/executable-version-updates.md"
      - "!docs/causal-invalidation-barrier-research.md"
      - "!docs/decisions/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "justfile"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-toolchain/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - run: just docs-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 1

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # Publish the Pages artifact.
      id-token: write # Authenticate this deployment to Pages with OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
