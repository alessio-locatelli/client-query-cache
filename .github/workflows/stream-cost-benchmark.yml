name: Stream cost benchmark

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  benchmark:
    name: Collect stream-cost benchmark reports
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain

      - run: uv sync --locked --all-groups

      - run: uv run -- python -m benchmarks.stream_cost.run --output-dir benchmark-reports

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stream-cost-reports
          path: benchmark-reports/*.report.v1.json
          retention-days: 30
