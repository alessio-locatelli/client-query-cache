name: Stream cost benchmark

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=uv versioning=pep440
  UV_VERSION: "0.12.19"

jobs:
  benchmark:
    name: Collect stream-cost benchmark reports
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          uv-version: ${{ env.UV_VERSION }}

      - run: uv sync --locked --all-groups

      - run: uv run -- python -m benchmarks.stream_cost.run --output-dir benchmark-reports

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stream-cost-reports
          path: benchmark-reports/*.report.v1.json
          if-no-files-found: warn
          retention-days: 30
