name: Stream cost benchmark

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# GitHub workflow syntax (2026-10-06):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The default is inherited repository/organization token policy. We override it because
# workflow tokens need only read access until a job explicitly elevates its grants;
# unspecified grants are none.
permissions:
  contents: read

jobs:
  benchmark:
    name: Collect stream-cost benchmark reports
    runs-on: ubuntu-24.04
    # timeout-minutes for benchmark (30m): The default is 360. We override it because
    # stalled jobs must stop within their assigned validation/publication budgets.
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout v7.0.1:
          # https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/action.yml
          # persist-credentials: The default is true. We override it because later
          # repository commands must not inherit checkout credentials.
          persist-credentials: false

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"

      # uv 0.12.19: https://docs.astral.sh/uv/reference/cli/
      # --locked: The default is inherited UV_LOCKED, otherwise unlocked resolution. We
      # override it because this standalone CI command must validate the committed
      # lockfile.
      # --no-default-groups --group: The default includes dev. We override it
      # because this job needs only the benchmark tools.
      # UV_NO_SYNC: The default is false. We override it because uv run must
      # reuse the explicitly synchronized environment without adding dev.
      - run: uv sync --locked --no-default-groups --group benchmark

      - run: uv run -- python -m benchmarks.stream_cost.run --output-dir benchmark-reports

      # The default is implicit success(). We override it because partial reports must
      # remain available after failed measurements.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stream-cost-reports
          path: benchmark-reports/*.report.v1.json
          # upload-artifact v7.0.1:
          # https://github.com/actions/upload-artifact/blob/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a/action.yml
          # retention-days: The default is inherited repository/organization retention.
          # We override it because intermediate release artifacts and diagnostics need
          # bounded storage lifetimes.
          retention-days: 30
