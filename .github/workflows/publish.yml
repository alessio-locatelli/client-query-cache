name: Publish to PyPI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
  # The default is false. We override it because release publication must not be interrupted after publishing to PyPI but before undrafting its GitHub release; this privileged safety pin stays explicit because disposable jobs cannot exercise that live two-service transition.
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Required by `gh release create` to draft the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Tag %s is not a stable vX.Y.Z release tag.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: $/.github/actions/setup-toolchain

      - run: uv sync --locked --all-groups

      - run: just verify-release "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

      - run: python3 scripts/extract_changelog_section.py "${RELEASE_TAG#v}" > release-notes.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - run: gh release create "${RELEASE_TAG}" --draft --title "${RELEASE_TAG}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

  publish:
    name: Publish to PyPI
    needs: build-and-verify
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC); no stored API token is used.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github-release:
    name: Publish the GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Required by `gh release edit` to undraft the GitHub Release.
    steps:
      - run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
