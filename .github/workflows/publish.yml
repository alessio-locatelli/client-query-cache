name: Publish to PyPI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
  # The default is false. We keep it explicit because release publication must not be interrupted after publishing to PyPI but before undrafting its GitHub release; this privileged safety pin stays explicit because disposable jobs cannot exercise that live two-service transition.
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"

# GitHub workflow syntax (2026-10-06):
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# The default is inherited repository/organization token policy. We override it because
# workflow tokens need only read access until a job explicitly elevates its grants;
# unspecified grants are none.
permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify release artifacts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # The default is true. Both native architectures must report their outcome.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstrategyfail-fast
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # timeout-minutes for build-and-verify (15m), attest (5m), publish (10m),
    # publish-github-release (10m): The default is 360. We override it because stalled jobs must stop within
    # their assigned validation/publication budgets.
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout v7.0.1:
          # https://github.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/action.yml
          # persist-credentials: The default is true. We override it because later
          # repository commands must not inherit checkout credentials.
          persist-credentials: false

      - run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Tag %s is not a stable vX.Y.Z release tag.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: $/.github/actions/setup-toolchain
        with:
          rust: "true"
          rust-components: llvm-tools

      # uv 0.12.19: https://docs.astral.sh/uv/reference/cli/
      # --locked: The default is inherited UV_LOCKED, otherwise unlocked resolution. We
      # override it because this standalone CI command must validate the committed
      # lockfile.
      # --no-default-groups --group: The default includes dev. We override it
      # because this job needs only the build tools.
      # UV_NO_SYNC: The default is false. We override it because uv run must
      # reuse the explicitly synchronized environment without adding dev.
      - run: uv sync --locked --no-default-groups --group build

      - run: just verify-release "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.runner }}
          # Keep one sdist; ARM contributes its verified wheel only.
          path: ${{ matrix.runner == 'ubuntu-24.04' && 'dist/' || 'dist/*.whl' }}
          # upload-artifact v7.0.1:
          # https://github.com/actions/upload-artifact/blob/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a/action.yml
          # retention-days: The default is inherited repository/organization retention.
          # We override it because intermediate release artifacts and diagnostics need
          # bounded storage lifetimes.
          retention-days: 7

  attest:
    name: Attest build provenance
    needs: build-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # id-token, attestations: The default is none under workflow permissions. We
      # override them because actions/attest requires an OIDC token to sign with
      # Sigstore and Attestations write access to store the result.
      # https://github.com/actions/attest/blob/1e69f48acb82d1966a394da916b4c1698aa569d6/action.yml
      id-token: write # Required to sign provenance with the workflow identity.
      attestations: write # Required to store provenance in the GitHub attestation API.
    steps:
      # download-artifact in attest and publish: pattern defaults to all artifacts;
      # merge-multiple defaults to false. We override them because both architectures'
      # verified distributions must land in one directory.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/*

      # gh 2.97.0: https://cli.github.com/manual/gh_attestation_verify
      # --bundle: The default is fetching attestations from the GitHub attestation API.
      # We override it because the freshly created attestation may not be queryable yet.
      # --signer-workflow: The default is no constraint on the signing workflow. We
      # override it because only publish.yml may vouch for a release.
      # --source-ref: The default is no constraint on the source ref. We override it
      # because the provenance must name the release tag.
      # --deny-self-hosted-runners: The default is accepting self-hosted runners. We
      # override it because the signing job must run on a GitHub-hosted runner.
      - run: |
          for file in dist/*; do
            gh attestation verify "${file}" --bundle "${BUNDLE_PATH}" --repo alessio-locatelli/client-query-cache --signer-workflow alessio-locatelli/client-query-cache/.github/workflows/publish.yml --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          done
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}

  prepare-github-release:
    name: Prepare GitHub release
    needs: attest
    runs-on: ubuntu-24.04
    # The default is 360 minutes. Draft preparation needs only checkout and the API.
    timeout-minutes: 5
    permissions:
      # GitHub Releases API: https://docs.github.com/en/rest/releases/releases#create-a-release
      # The default is workflow read access. Draft creation requires Contents write.
      contents: write # Required by gh release create --draft.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: python3 scripts/extract_changelog_section.py "${RELEASE_TAG#v}" > release-notes.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # gh 2.97.0: https://cli.github.com/manual/gh_release_create
      # --draft: The default is publishing immediately. We override it because the
      # GitHub release must stay staged until PyPI succeeds.
      - run: gh release create "${RELEASE_TAG}" --draft --title "${RELEASE_TAG}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

  publish:
    name: Publish to PyPI
    needs: prepare-github-release
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # id-token: The default is none under workflow permissions. We override it because
      # PyPI Trusted Publishing requires OIDC.
      id-token: write # Required for PyPI Trusted Publishing (OIDC); no stored API token is used.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # download-artifact: https://github.com/actions/download-artifact
          # Same inputs and rationale as the attest job's download step.
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github-release:
    name: Publish the GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # GitHub Releases API: https://docs.github.com/en/rest/releases/releases#update-a-release
      # The default is workflow read access. Publishing the draft requires Contents write.
      contents: write # Required by gh release edit --draft=false.
    steps:
      # gh 2.97.0: https://cli.github.com/manual/gh_release_edit
      # --draft=false: The default is preserving existing draft state. We override it
      # because successful PyPI publication must expose the staged release.
      - run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
