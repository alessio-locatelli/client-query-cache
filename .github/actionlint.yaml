paths:
  .github/workflows/**/*.yml:
    ignore:
      # The default is no ignored diagnostics (https://github.com/rhysd/actionlint/blob/v1.7.12/config.go). We override it because actionlint does not recognize GitHub's same-commit local action syntax (https://github.com/rhysd/actionlint/issues/711).
      - reusable workflow call "\$/.+" at "uses" is not following the format
      - specifying action "\$/.+" in invalid format because ref is missing
