default_install_hook_types: [pre-commit, commit-msg]
exclude: ^docs/specifications/

default_language_version:
  # The default is no project language-version mapping; hooks use their own language_version or default resolution (https://github.com/j178/prek/blob/v0.5.7/docs/reference/configuration.md#default_language_version). We override it because Python hooks must stay on the supported 3.14 baseline when development Python advances.
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        # Hook arguments: https://github.com/pre-commit/pre-commit-hooks/blob/v6.0.0/pre_commit_hooks/check_added_large_files.py
        # --maxkb: The default is 500. We override it because tracked files must stay below 300 KiB.
        # --enforce-all: The default is added files only. We override it because enlarging an existing file must also fail the limit.
        args: ["--maxkb=300", "--enforce-all"]
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        # Preserve Google's downloaded verification file unchanged.
        exclude: ^docs/site/google5a37145ea1915a18\.html$
      - id: mixed-line-ending
        # The default is auto (https://github.com/pre-commit/pre-commit-hooks/blob/v6.0.0/pre_commit_hooks/mixed_line_ending.py). We override it because every contributor platform must produce LF line endings.
        args: ["--fix=lf"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: "44.199.0"
    hooks:
      - id: renovate-config-validator
        # Hook arguments: https://github.com/renovatebot/pre-commit-hooks/blob/44.199.0/.pre-commit-hooks.yaml
        # --strict: The default is false. We override it because validation warnings must fail the quality gate.
        # --no-global: The default is global validation allowed. We override it because this file may contain only repository options.
        args: [--strict, --no-global]
        env:
          npm_config_allow_scripts: re2

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.39.0"
    hooks:
      - id: check-jsonschema
        name: Validate Context7 configuration
        files: ^context7\.json$
        args: ["--schemafile", "https://context7.com/schema/context7.json"]

  - repo: local
    hooks:
      # uv run --locked in ruff-check and ruff-format: The default is inherited UV_LOCKED, otherwise updating a stale lockfile (https://github.com/astral-sh/uv/blob/0.13.6/crates/uv-cli/src/lib.rs#L3387-L3392). We override it because hooks must run the Ruff release committed in uv.lock.
      # --only-group lint in ruff-check and ruff-format: The default is the project and default groups (dev) (https://github.com/astral-sh/uv/blob/0.13.6/crates/uv-cli/src/lib.rs#L6808-L6814). We override it because hooks need only Ruff, without installing every development tool or building the native extension.
      - id: ruff-check
        name: ruff check
        # Ruff arguments: https://github.com/astral-sh/ruff/blob/0.17.5/docs/configuration.md#full-command-line-interface
        # --fix: The default is false. We override it because hook runs should repair supported violations.
        # --exit-non-zero-on-fix: The default is false. We override it because an edit must stop the commit until its repaired files are reviewed and staged.
        entry: uv run --locked --only-group lint -- ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group lint -- ruff format
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  - repo: https://github.com/alessio-locatelli/ruff-extra-rules
    rev: v0.6.0
    hooks:
      - id: ruff-extra-rules

  - repo: local
    hooks:
      # The hook from ruff-extra-rules runs the first `ty` on PATH with the hook's own environment active (https://github.com/alessio-locatelli/ruff-extra-rules/blob/v0.6.0/docs/rules/redundant-type-conversion.md#prerequisite-ty). We run it through uv instead because type inference must use the `ty` from uv.lock and the project environment, which a Git hook does not activate. Its ruff-extra-rules release comes from `[tool.uv.sources]` in pyproject.toml, not from the remote hook's rev above; keeping both in step is tracked in https://github.com/alessio-locatelli/client-query-cache/issues/479.
      - id: ruff-extra-rules-ty
        name: Extra Python rule checks (redundant-type-conversion, redundant-dict-get)
        entry: uv run --locked -- python -m pre_commit_hooks.ruff_extra_rules_ty
        language: system
        types: [python]
        require_serial: true

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.13.6"
    hooks:
      - id: uv-lock
        # The default is updating the lockfile (https://github.com/astral-sh/uv/blob/0.13.6/crates/uv-cli/src/lib.rs#L3814-L3821). We override it because validation must reject stale resolution without changing it.
        args: ["--check"]

  - repo: https://github.com/ariebovenberg/slotscheck
    rev: v0.21.0
    hooks:
      - id: slotscheck
        # The default is the hook's Python environment (https://github.com/ariebovenberg/slotscheck/blob/v0.21.0/.pre-commit-hooks.yaml), which a configured language replaces (https://github.com/j178/prek/blob/v0.5.7/crates/prek/src/hook.rs#L66-L88). We override it because slotscheck must import the synchronized project and its installed dependencies.
        language: system

  - repo: https://github.com/crate-ci/typos
    rev: "v1.51.1"
    hooks:
      - id: typos

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # The default is inherited --default-schema-catalogs arguments (https://github.com/ComPWA/taplo-pre-commit/blob/v0.9.3/.pre-commit-hooks.yaml). We override it because Taplo cannot decode the remote catalog; syntax linting remains usable (https://github.com/tamasfe/taplo/issues/463).
        args: []

  - repo: local
    hooks:
      # pass_filenames for rust-lint and ast-grep-test: The default is true (https://github.com/j178/prek/blob/v0.5.7/docs/reference/configuration.md#pass_filenames). We override
      # it because these commands validate the whole crate or rule set rather than file operands.
      - id: ast-grep
        name: ast-grep
        entry: ast-grep scan
        language: python
        additional_dependencies: ["ast-grep-cli==0.51.0"]
        types: [python]
        require_serial: true
      - id: ast-grep-test
        name: ast-grep rule tests
        entry: ast-grep test
        language: python
        additional_dependencies: ["ast-grep-cli==0.51.0"]
        files: ^(sgconfig\.yml|development/ast-grep/(rules|rule-tests)/)
        pass_filenames: false
      - id: rust-lint
        name: Rust quality checks
        entry: just rust-lint
        language: system
        files: ^(src/shared-index/|justfile$|rust-toolchain\.toml$|\.pre-commit-config\.yaml$)
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: npm run format:check --
        language: system
        # The default is true (https://github.com/j178/prek/blob/v0.5.7/docs/reference/configuration.md#pass_filenames). We override it because the npm script selects the complete formatting scope itself.
        pass_filenames: false
        types_or: [markdown, yaml, json]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # `vulture` whitelist must be auto-generated via `vulture --make-whitelist > .vulture_whitelist`, not edited by hand.
        exclude: .vulture_whitelist

  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        # Lockfiles list registry artifacts, this configuration lists exclusion patterns, and Renovate download patterns/templates are not fetchable links; Renovate's schema is validated separately. Lychee warns about passed inputs that its own configuration excludes, so skip them before they are passed.
        exclude: ^(lychee\.toml|package-lock\.json|renovate\.json5|uv\.lock)$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
