exclude: ^specifications/

default_language_version:
  # Prek 0.5.2: https://github.com/j178/prek/blob/v0.5.2/docs/reference/configuration.md#default_language_version
  # The default is no project language-version mapping; hooks use their own language_version or default resolution. We override it because Python hooks must stay on the supported 3.14 baseline when development Python advances.
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        # pre-commit-hooks v6.0.0: https://github.com/pre-commit/pre-commit-hooks/blob/v6.0.0/pre_commit_hooks/check_added_large_files.py
        # --maxkb: The default is 500. We override it because tracked files must stay below 300 KiB.
        # --enforce-all: The default is added files only. We override it because enlarging an existing file must also fail the limit.
        args: ["--maxkb=300", "--enforce-all"]
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # v6.0.0: https://github.com/pre-commit/pre-commit-hooks/blob/v6.0.0/pre_commit_hooks/mixed_line_ending.py
        # The default is auto. We override it because every contributor platform must produce LF line endings.
        args: ["--fix=lf"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: "44.133.0"
    hooks:
      - id: renovate-config-validator
        # Hook 44.133.0: https://github.com/renovatebot/pre-commit-hooks/blob/44.133.0/.pre-commit-hooks.yaml
        # --strict: The default is false. We override it because validation warnings must fail the quality gate.
        # --no-global: The default is global validation allowed. We override it because this file may contain only repository options.
        args: [--strict, --no-global]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
      - id: check-jsonschema
        name: Validate Context7 configuration
        files: ^context7\.json$
        args: ["--schemafile", "https://context7.com/schema/context7.json"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        # Ruff v0.16.10: https://docs.astral.sh/ruff/configuration/
        # --fix: The default is false. We override it because hook runs should repair supported violations.
        # --exit-non-zero-on-fix: The default is false. We override it because an edit must stop the commit until its repaired files are reviewed and staged.
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/alessio-locatelli/ruff-extra-rules
    rev: v0.5.0
    hooks:
      - id: ruff-extra-rules

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.12.23"
    hooks:
      - id: uv-lock
        # uv 0.12.23: https://docs.astral.sh/uv/reference/cli/#uv-lock--check
        # The default is updating the lockfile. We override it because validation must reject stale resolution without changing it.
        args: ["--check"]

  - repo: https://github.com/ariebovenberg/slotscheck
    rev: v0.21.0
    hooks:
      - id: slotscheck
        # Prek 0.5.2 HookSpec::from_remote: https://github.com/j178/prek/blob/v0.5.2/crates/prek/src/hook.rs#L65-L87
        # Hook language: https://github.com/ariebovenberg/slotscheck/blob/v0.21.0/.pre-commit-hooks.yaml
        # The default is the hook's Python environment. We override it because slotscheck must import the synchronized project and its installed dependencies.
        language: system

  - repo: https://github.com/crate-ci/typos
    rev: "v1.50.3"
    hooks:
      - id: typos

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # Hook v0.9.3: https://github.com/ComPWA/taplo-pre-commit/blob/v0.9.3/.pre-commit-hooks.yaml
        # The default is inherited --default-schema-catalogs arguments. We override it because Taplo cannot decode the remote catalog; syntax linting remains usable (https://github.com/tamasfe/taplo/issues/463).
        args: []

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm run format:check --
        language: system
        # Prek 0.5.2: https://github.com/j178/prek/blob/v0.5.2/docs/reference/configuration.md#pass_filenames
        # The default is true. We override it because the npm script selects the complete formatting scope itself.
        pass_filenames: false
        types_or: [markdown, yaml, json]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
