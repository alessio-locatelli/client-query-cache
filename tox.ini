[tox]
envlist = py313, pymongo-min

[testenv]
runner = uv-venv-lock-runner
package = wheel
dependency_groups = test
commands =
    pytest tests/ --import-mode importlib

[testenv:pymongo-min]
description = Verify the declared PyMongo lower bound exposes AsyncMongoClient
runner = uv-venv-runner
package = wheel
deps = pymongo==4.18
commands =
    python -c "from pymongo import AsyncMongoClient; print(AsyncMongoClient)"
