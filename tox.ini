[tox]
envlist = py314, integration, e2e, pymongo-min

[testenv]
# tox-uv 1.36.0: https://github.com/tox-dev/tox-uv/blob/1.36.0/src/tox_uv/plugin.py
# The default is uv-venv-runner from tox-uv. We override it because correctness lanes must synchronize the committed lockfile.
runner = uv-venv-lock-runner
# https://github.com/tox-dev/tox-uv/blob/1.36.0/src/tox_uv/_run_lock.py
# The default is editable for this lock runner. We override it because tests must exercise an installed wheel rather than an editable source tree.
package = wheel
commands =
    # pytest 9.1.1: https://docs.pytest.org/en/stable/reference/reference.html
    # -m in this lane, integration, e2e and benchmark: The default is pytest.ini not
    # memory. We override it because each lane must select its designated test tier.
    pytest -m "unit and not memory"

[testenv:integration]
commands =
    pytest -m "integration and not memory"

[testenv:e2e]
commands =
    pytest -m "e2e and not memory"

[testenv:benchmark]
commands =
    # xdist 3.8.0: https://pytest-xdist.readthedocs.io/en/stable/distribution.html
    # -n 0: The default is pytest.ini auto. We override it because latency measurements
    # must run without competing workers.
    pytest -m "benchmark and not memory" -n 0

[testenv:pymongo-min]
description = Test collection reads, cursors, and sessions at the declared PyMongo minimum
# The default is the inherited testenv lock runner. We override it because minimum-version validation must resolve direct dependency floors independently of the lockfile.
runner = uv-venv-runner
# https://github.com/tox-dev/tox-uv/blob/1.36.0/src/tox_uv/_installer.py
# The default is unset (uv's highest-version resolution). We override it because this lane validates the published direct dependency lower bounds.
uv_resolution = lowest-direct
# uv 0.12.20: https://docs.astral.sh/uv/reference/cli/#uv-pip-install
# The default retains satisfying installed versions. We override it because the dev
# group can install a newer transitive PyMongo before the wheel's floor is resolved.
install_command = {env:TOX_UV_PATH:uv} pip install --upgrade {opts} {packages}
dependency_groups = dev
# tox 4.64.5: https://tox.wiki/en/latest/config.html#pass_env
# The default forwards platform/tool variables. We override it because disposable
# MongoDB must use the caller's Docker-compatible runtime, including host Podman.
pass_env =
    DOCKER_*
    TESTCONTAINERS_*
commands_pre =
    python -c "import sys; from importlib.metadata import requires, version; from packaging.requirements import Requirement; from packaging.version import Version; from pymongo import AsyncMongoClient; requirement = next(item for item in map(Requirement, requires('client-query-cache')) if item.name == 'pymongo'); minimum = next(item.version for item in requirement.specifier if item.operator == '>='); installed = version('pymongo'); print('Python:', sys.version, '\nPyMongo:', installed, '\nDeclared minimum:', minimum); sys.exit(0 if Version(installed) == Version(minimum) else 'Installed PyMongo must equal the declared minimum')"
commands =
    # pytest 9.1.1: https://docs.pytest.org/en/stable/reference/reference.html
    # --log-file: The default is pytest.log. We override it because minimum-driver
    # diagnostics must be distinct from locked-driver diagnostics.
    # --log-file-level: The default is pytest.ini DEBUG. We override it because
    # uploaded failure logs need bounded, actionable diagnostics.
    pytest tests/synchronous/test_collection.py tests/asynchronous/test_collection.py tests/test_cached_cursors.py tests/test_bound_sessions.py --log-file=pytest-pymongo-min.log --log-file-level=WARNING
