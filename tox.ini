[tox]
envlist = py314, integration, e2e, pymongo-min

[testenv]
runner = uv-venv-lock-runner
package = wheel
commands =
    pytest -m unit tests/ --import-mode importlib

[testenv:integration]
commands =
    pytest -m integration tests/ --import-mode importlib

[testenv:e2e]
commands =
    pytest -m e2e tests/ --import-mode importlib

[testenv:benchmark]
commands =
    pytest -m benchmark tests/ --import-mode importlib

[testenv:pymongo-min]
description = Verify the declared PyMongo lower bound exposes AsyncMongoClient
runner = uv-venv-runner
package = wheel
deps = pymongo==4.18
commands =
    python -c "from pymongo import AsyncMongoClient; print(AsyncMongoClient)"
