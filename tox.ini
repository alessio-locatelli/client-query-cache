[tox]
envlist = py314, integration, e2e, pymongo-min

[testenv]
runner = uv-venv-lock-runner
package = wheel
commands =
    pytest -m unit

[testenv:integration]
commands =
    pytest -m integration

[testenv:e2e]
commands =
    pytest -m e2e

[testenv:benchmark]
commands =
    pytest -m benchmark

[testenv:pymongo-min]
description = Verify the declared PyMongo lower bound exposes AsyncMongoClient
runner = uv-venv-runner
package = wheel
uv_resolution = lowest-direct
commands =
    python -c "from pymongo import AsyncMongoClient; print(AsyncMongoClient)"
