# The default license allowlist is empty
# (https://github.com/EmbarkStudios/cargo-deny/blob/0.20.2/docs/src/checks/licenses/cfg.md#the-allow-field-optional). We override it because these permissive
# licenses cover the resolved native dependency graph and permit distribution.
[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]

[bans]
# Defaults: https://github.com/EmbarkStudios/cargo-deny/blob/0.20.2/docs/src/checks/bans/cfg.md
# The default is warn. We override it because duplicate versions must be resolved.
multiple-versions = "deny"
# The default is warn. We override it because unbounded dependencies hinder review.
wildcards = "deny"

[sources]
# Both defaults are warn (https://github.com/EmbarkStudios/cargo-deny/blob/0.20.2/docs/src/checks/sources/cfg.md). We override them because only crates.io is
# approved.
unknown-registry = "deny"
unknown-git = "deny"
