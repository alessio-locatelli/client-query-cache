[project]
name = "mongo-client-cache"
version = "0.1.0"
description = ""
authors = [
  { name = "Alessio Locatelli", email = "<software.development@secure.mailbox.org>" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pymongo>=4.18"]

[dependency-groups]
test = [
  "coverage>=7.16.0",
  "faker>=40.38.0",
  "hypothesis>=6.167.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-timeout>=2.4.0",
  "slotscheck>=0.20.1",
  "strict-no-cover>=0.1.1",
  "testcontainers[mongodb]>=4.15.0",
  "tox>=4.61.2",
  "tox-uv>=1.36.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.coverage.run]
branch = true
source = ["mongo_client_cache"]

[tool.coverage.report]
fail_under = 81.10
precision = 2
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.vulture]
paths = ["mongo_client_cache", "tests"]
ignore_names = [
  "operationType",
  "fullDocument",
  "ns",
  "documentKey",
  "wallTime",
  "log_when_test_starts",
  "faker_seed",
  "fill_collection",
  "pytestmark",
]
