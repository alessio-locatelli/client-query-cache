[project]
name = "client-query-cache"
version = "0.6.0"
description = "Client-side caching for PyMongo, kept coherent using MongoDB change streams."
authors = [
  { name = "Alessio Locatelli", email = "<software.development@secure.mailbox.org>" },
]
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
classifiers = [
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["pymongo>=4.18.1"]

[project.urls]
Repository = "https://github.com/alessio-locatelli/client-query-cache"
Documentation = "https://alessio-locatelli.github.io/client-query-cache/"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.45.0"]

[dependency-groups]
dev = [
  "covdefaults>=2.3.0",
  "mypy>=2.3.1",
  "types-docker>=7.2.0.20260827",
  "types-paramiko>=5.0.0.20260724",
  "types-pexpect>=4.9.0.20260518",
  "types-pygments>=2.21.0.20260819",
  "types-pysocks>=1.7.1.20260518",
  "types-simplejson>=4.1.0.20260724",
  "faker>=40.38.0",
  "hypothesis>=6.168.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-timeout>=2.4.0",
  "slotscheck>=0.21.0",
  "strict-no-cover>=0.1.1",
  "testcontainers[mongodb]>=4.15.0",
  "tox>=4.63.0",
  "tox-uv>=1.36.0",
  "jsonschema>=4.26.0",
  "types-jsonschema>=4.26.0.20260518",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-sdk>=1.45.0",
  "types-psutil>=7.2.2.20260906",
  "psutil>=7.2.2",
  "dnspython>=2.8.0",
  "python-snappy>=0.7.3",
  "pytest-xdist[psutil]>=3.8.0",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260906",
]
docs = ["mike", "tomli-w>=1.2.0", "zensical>=0.0.68"]
memory = ["pytest-memray>=1.11.0"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# uv 0.12.9 / lock context: https://docs.astral.sh/uv/reference/settings/#environments
# The default is all environments. We override it because development dependencies and their lock resolution target Linux.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" } # pragma: allowlist secret

[tool.slotscheck]
# slotscheck 0.21.0: https://github.com/ariebovenberg/slotscheck/blob/v0.21.0/src/slotscheck/config.py
# require-subclass: The default is false. We override it because subclasses must preserve their slotted parent's memory contract.
require-subclass = true
exclude-modules = '''
(
  ^specifications
  | ^examples
)
'''

[tool.vulture]
paths = ["src", "tests", "benchmarks", ".vulture_whitelist"]

[tool.ruff-extra-rules]
# ruff-extra-rules v0.5.0: https://github.com/alessio-locatelli/ruff-extra-rules/blob/v0.5.0/README.md
# The default is false. We override it because hook runs should apply available repairs.
fix = true
exclude = ["specifications"]
extend-select = ["unused-pytriage"]
[tool.ruff-extra-rules.meaningless-vars]
# ruff-extra-rules v0.5.0: https://github.com/alessio-locatelli/ruff-extra-rules/tree/v0.5.0/src/pre_commit_hooks/ast_checks
# For meaningless-vars, redundant-assignment, redundant-type-conversion, redundant-dict-get, and defined-far-from-use level:
# The default is conservative. We override it because repository quality checks must include the broader supported simplifications and naming diagnostics.
level = "aggressive"
[tool.ruff-extra-rules.redundant-assignment]
level = "aggressive"
[tool.ruff-extra-rules.redundant-type-conversion]
level = "aggressive"
[tool.ruff-extra-rules.redundant-dict-get]
level = "aggressive"
[tool.ruff-extra-rules.defined-far-from-use]
level = "aggressive"
