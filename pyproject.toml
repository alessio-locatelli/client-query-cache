[project]
name = "mongo-client-cache"
version = "0.1.0"
description = ""
authors = [
  { name = "Alessio Locatelli", email = "<software.development@secure.mailbox.org>" },
]
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = ["pymongo>=4.18"]

[dependency-groups]
dev = [
  "covdefaults>=2.3.0",
  "mypy>=2.3.1",
  "types-docker>=7.2.0.20260827",
  "types-paramiko>=5.0.0.20260724",
  "types-pexpect>=4.9.0.20260518",
  "types-pygments>=2.21.0.20260819",
  "types-pysocks>=1.7.1.20260518",
  "types-simplejson>=4.1.0.20260724",
  "coverage>=7.16.0",
  "faker>=40.38.0",
  "hypothesis>=6.167.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-timeout>=2.4.0",
  "slotscheck>=0.20.1",
  "strict-no-cover>=0.1.1",
  "testcontainers[mongodb]>=4.15.0",
  "tox>=4.61.2",
  "tox-uv>=1.36.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.slotscheck]
strict-imports = true
require-superclass = true
require-subclass = true
exclude-modules = '''
(
  ^specifications
)
'''

[tool.vulture]
paths = ["src", "tests", ".vulture_whitelist"]

[tool.ruff-extra-rules]
fix = true
exclude = ["specifications"]
extend-select = ["unused-pytriage"]
[tool.ruff-extra-rules.meaningless-vars]
level = "aggressive"
[tool.ruff-extra-rules.redundant-assignment]
level = "aggressive"
[tool.ruff-extra-rules.redundant-type-conversion]
level = "aggressive"
[tool.ruff-extra-rules.redundant-dict-get]
level = "aggressive"
