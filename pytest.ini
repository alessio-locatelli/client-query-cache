[pytest]
markers =
    unit: tests that do not use MongoDB or a container runtime
    integration: tests that use a disposable MongoDB replica set
    e2e: tests that exercise an installed wheel against disposable MongoDB
    benchmark: performance measurements excluded from correctness gates
    memory: opt-in allocation regression tests
    limit_memory: enforce a peak allocation ceiling with pytest-memray
log_format = '%(asctime)s, %(levelname)-8s [%(filename)s:%(module)s:%(funcName)s:%(lineno)d] %(message)s'
log_date_format = %M:%S.%f
# pytest 9.1.1 logging: https://github.com/pytest-dev/pytest/blob/9.1.1/src/_pytest/logging.py
# The default is inherited from Python logging's effective logger level (normally WARNING). We override it because test diagnostics must capture DEBUG events for failure investigation.
log_level = 10

log_file = pytest.log
# The default is inherited from the effective log_level setting, including CLI overrides. We override it because file diagnostics must retain DEBUG independently of console capture settings.
log_file_level = DEBUG
# pytest 9.1.1: https://docs.pytest.org/en/stable/reference/reference.html#confval-strict
# The default is false. We override it because unknown options/markers, duplicate parameter IDs, and unexpected xfail passes must fail validation.
strict = true
# pytest/xdist 3.8.0: https://pytest-xdist.readthedocs.io/en/stable/distribution.html
# -m: The default is no marker filter. We override it because allocation tests run in their dedicated opt-in lane.
# -n: The default is no workers. We override it because correctness tests use the available CPU allocation.
# --dist: The default is load. We override it because file grouping reuses module-scoped MongoDB setup within a worker.
addopts = --ignore=specifications -m "not memory" -n auto --dist=loadfile
testpaths = tests

# pytest-asyncio 1.4.0: https://github.com/pytest-dev/pytest-asyncio/blob/v1.4.0/pytest_asyncio/plugin.py
# The default is strict. We override it because asyncio tests and fixtures are discovered without per-test decorators.
asyncio_mode = auto
# The default is the async fixture's caching scope when unset. We override it because each async fixture must use a function-scoped event loop, independent of its caching scope.
asyncio_default_fixture_loop_scope = function

# pytest-timeout 2.4.0: https://pypi.org/project/pytest-timeout/2.4.0/
# The default is no timeout. We override it because a stalled test must fail after 30 seconds instead of hanging a worker.
timeout = 30
