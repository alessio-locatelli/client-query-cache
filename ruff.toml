extend-exclude = ["specifications"]
# Ruff v0.16.10: https://docs.astral.sh/ruff/settings/#force-exclude
# The default is false. We override it because explicitly passed hook filenames must still respect the submodule exclusion.
force-exclude = true

[lint]
# The default is false. We override it because quality checks include the selected preview rules.
# https://docs.astral.sh/ruff/settings/#lint_preview
preview = true
# The default is E4, E7, E9, F. We override it because every applicable rule should run unless its accepted exception is listed below.
# https://docs.astral.sh/ruff/settings/#lint_select
select = ["ALL"]
# For ignore/per-file-ignores, the default is no exclusions from the selected policy
# (apart from Ruff's conflicting-rule resolution). Each group permits the stated repository idiom.
# https://docs.astral.sh/ruff/settings/#lint_ignore
ignore = [
  # The default is enabled by ALL. We override it because detailed public guidance belongs in canonical guides rather than mandatory docstrings on every internal symbol.
  "D",
  # The default is enabled by ALL. We override it because Ruff's formatter owns trailing-comma layout.
  "missing-trailing-comma",
  # The default is enabled by ALL. We override it because tests and internal invariants use Python assertions.
  "assert",
  # The default is enabled by ALL. We override it because test expectations and protocol discriminator comparisons use exact literal values.
  "magic-value-comparison",
  # The default is enabled by ALL. We override it because protocol dispatch and scenario tests need explicit branches, exits, and parameter sets beyond generic size limits.
  "too-many-branches",
  "too-many-return-statements",
  "complex-structure",
  "too-many-statements",
  "too-many-arguments",
  # The default is enabled by ALL. We override it because contextual failure messages are written at their raise sites.
  "raw-string-in-exception",
  "raise-vanilla-args",
  # The default is enabled by ALL. We override it because contributor CLIs and benchmark reports write to standard output.
  "print",
  # The default is enabled by ALL. We override it because the repository LICENSE supplies the shared copyright notice.
  "missing-copyright-notice",
  # Rules from the preview.
  # The default is enabled by ALL. We override it because lifecycle adapters explicitly invoke native dunder methods.
  "unnecessary-dunder-call",
  # The default is enabled by ALL. We override it because benchmark orchestration retains named measurements and resources throughout a run.
  "too-many-locals",
  # The default is enabled by ALL. We override it because narrow documented suppressions protect verified tool limitations and safe subprocess calls.
  "noqa-comments",
  # The default is enabled by ALL. We override it because shared test setup and environment guards use autouse fixtures.
  "pytest-fixture-autouse",
  # The default is enabled by ALL. We override it because automation imports subprocess while call-specific safety checks remain enabled.
  "suspicious-subprocess-import",
  # The default is enabled by ALL. We override it because benchmark workload generation needs deterministic non-security randomness.
  "suspicious-non-cryptographic-random-usage",
  # The default is enabled by ALL. We override it because explicit exception handlers expose unreachable branches to coverage; contextlib.suppress is banned below.
  "suppressible-exception",
]

[lint.flake8-tidy-imports.banned-api]
# The default is no banned APIs. We override it because coverage cannot identify an unused suppressed exception handler.
# https://docs.astral.sh/ruff/settings/#lint_flake8-tidy-imports_banned-api
"contextlib.suppress".msg = "Use try/except: coverage cannot show that a suppressed exception is never raised."

[lint.per-file-ignores]
# The default is enabled by ALL. We override it because tests directly exercise private helpers, inspect contracts, and parametrize boolean scenarios.
"tests/*" = [
  "private-member-access",
  "boolean-type-hint-positional-argument",
  "import-private-name",
]
# The default is enabled by ALL. We override it because benchmarks measure internal cache mechanisms alongside the public API.
"benchmarks/*" = ["import-private-name"]

[lint.flake8-type-checking]
# The default is ["typing"]. We override it because public dataclass annotations must resolve at runtime through typing.get_type_hints, so constrained aliases and their metadata stay runtime imports.
# https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_exempt-modules
exempt-modules = ["typing", "annotated_types", "client_query_cache._types"]
