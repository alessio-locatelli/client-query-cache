[package]
name = "client-query-cache-shared-index"
version = "0.8.0"
description = "Shared index for client-query-cache worker caches."
repository = "https://github.com/alessio-locatelli/client-query-cache"
documentation = "https://alessio-locatelli.github.io/client-query-cache/"
edition = "2024"
license = "Apache-2.0"
# The default is publishing to any registry allowed (https://doc.rust-lang.org/1.100.0/cargo/reference/manifest.html#the-publish-field). We override it because the native crate ships only inside the Python distribution.
publish = false

[lib]
name = "_shared_index"
crate-type = ["cdylib"]

[features]
python = ["dep:itoa", "dep:pyo3", "dep:rustc-hash", "dep:slab"]

[dependencies]
itoa = { version = "1.0.19", optional = true }
rapidhash = { version = "4.5.1", default-features = false }
libc = "0.2.190"
slab = { version = "0.4.12", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3-py314"], optional = true }
rustc-hash = { version = "2.1.3", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[lints.rust]
# The default is warning on every cfg name Cargo does not declare (https://doc.rust-lang.org/1.100.0/rustc/check-cfg/cargo-specifics.html). We override it because the loom model tests are selected with --cfg loom.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[profile.release]
# The default is false (https://doc.rust-lang.org/1.100.0/cargo/reference/profiles.html#lto), which optimizes across a crate's own code generation units only. We override it because whole-program optimization across the crate and PyO3 shortens the native cache entry points (reports/rust-build-profile/summary.md).
lto = "fat"
# The default is 16 (https://doc.rust-lang.org/1.100.0/cargo/reference/profiles.html#codegen-units). We override it because a single unit lets the optimizer inline across the whole extension.
codegen-units = 1
