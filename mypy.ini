[mypy]
# mypy 2.3.1: https://mypy.readthedocs.io/en/stable/config_file.html
# The default is the running interpreter's version. We override it because checks must target the supported Python 3.14 baseline even on newer development interpreters.
python_version = 3.14
# The default is false. We override it because editor navigation needs exact diagnostic columns.
show_column_numbers = True
# The default is false. We override it because unreachable branches can conceal dead exception handling.
warn_unreachable=True
# The default is false. We override it because local diagnostics should include source snippets and location markers.
pretty=True
# The default is false. We override it because the repository requires mypy's full strict checking policy.
strict=True
files = src, tests, benchmarks

exclude = (?x)(
    ^specifications
  )
